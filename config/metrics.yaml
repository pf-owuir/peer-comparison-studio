# Standardized metrics.
#   survey    key in studio/ipeds.py SURVEY_FILES
#   kind      value (one IPEDS variable; default) or ratio (computed from metrics above it)
#   variable  column in the NCES file; flag = its X-prefixed status column
#   filter    selects rows in files with several rows per institution (e.g. GRTYPE)
#   subgroups also extract gender and race/ethnicity breakdowns (see SUBGROUP_COLUMNS)
#   period    label shown with the value; {year} = file year, {prior_year}, {cohort_6yr} = year - 6
# Definitions follow the NCES data dictionaries. IPEDS-published rates are used
# as published; counts are kept so rates can be checked.

- id: ret_ft_cohort
  period: "Fall {prior_year} cohort, retained to Fall {year}"
  label: Full-time retention cohort (adjusted)
  survey: EFD
  variable: RRFTCTA
  flag: XRRFTCTA
  unit: students
  definition: Prior fall's full-time, first-time degree/certificate-seeking cohort, minus exclusions plus inclusions.

- id: ret_ft_retained
  period: "Fall {prior_year} cohort, retained to Fall {year}"
  label: Full-time students retained
  survey: EFD
  variable: RET_NMF
  flag: XRET_NMF
  unit: students
  definition: Students in the adjusted full-time cohort still enrolled, or who completed, by the current fall.

- id: ret_ft_rate
  period: "Fall {prior_year} cohort, retained to Fall {year}"
  label: Full-time retention rate
  survey: EFD
  variable: RET_PCF
  flag: XRET_PCF
  unit: percent
  definition: Full-time retention rate as published by IPEDS (retained / adjusted cohort). For four-year institutions the cohort is bachelor's degree-seeking students.

- id: ret_pt_cohort
  period: "Fall {prior_year} cohort, retained to Fall {year}"
  label: Part-time retention cohort (adjusted)
  survey: EFD
  variable: RRPTCTA
  flag: XRRPTCTA
  unit: students
  definition: Prior fall's part-time, first-time degree/certificate-seeking cohort, minus exclusions plus inclusions.

- id: ret_pt_retained
  period: "Fall {prior_year} cohort, retained to Fall {year}"
  label: Part-time students retained
  survey: EFD
  variable: RET_NMP
  flag: XRET_NMP
  unit: students
  definition: Students in the adjusted part-time cohort still enrolled, or who completed, by the current fall.

- id: ret_pt_rate
  period: "Fall {prior_year} cohort, retained to Fall {year}"
  label: Part-time retention rate
  survey: EFD
  variable: RET_PCP
  flag: XRET_PCP
  unit: percent
  definition: Part-time retention rate as published by IPEDS. Small cohorts make this rate volatile.

- id: student_faculty_ratio
  period: "Fall {year}"
  label: Student-to-faculty ratio
  survey: EFD
  variable: STUFACR
  flag: XSTUFACR
  unit: ratio (students per 1 faculty)
  definition: Total FTE students not in graduate or professional programs divided by total FTE instructional staff not teaching in graduate or professional programs.

- id: entering_undergrads
  period: "Fall {year}"
  label: Total entering undergraduates
  survey: EFD
  variable: UGENTERN
  flag: XUGENTER
  unit: students
  definition: All students entering the institution at the undergraduate level for the first time this fall (first-time plus transfer-in, full- and part-time).

- id: entering_grs_cohort
  period: "Fall {year}"
  label: Graduation-rate cohort (entering this fall)
  survey: EFD
  variable: GRCOHRT
  flag: XGRCOHRT
  unit: students
  definition: Full-time, first-time degree/certificate-seeking undergraduates entering this fall (the cohort later tracked in the Graduation Rates survey).

# ---------------------------------------------------------------------------
# Graduation Rates (GR). One row per institution per GRTYPE; values are by
# gender and race/ethnicity. Four-year institutions only. The GR file for year Y
# tracks the fall Y-6 cohort to August 31 of year Y (150% of normal time).
# Checked against OWU's 2025 Data Feedback Report, figure 17 (2018 cohort).

- id: grs_cohort
  label: Graduation-rate cohort, adjusted (all degree-seeking)
  survey: GR
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  variable: GRTOTLT
  filter: {GRTYPE: 2}
  subgroups: true
  unit: students
  definition: Full-time, first-time degree/certificate-seeking undergraduates (bachelor's plus other degree-seeking subcohorts) minus allowable exclusions.

- id: grs_completers_150
  label: Completers within 150% of normal time (all degree-seeking)
  survey: GR
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  variable: GRTOTLT
  filter: {GRTYPE: 3}
  subgroups: true
  unit: students
  definition: Students in the adjusted cohort who completed any degree or certificate within 150% of normal time (six years for a bachelor's).

- id: grs_transfer_out
  label: Transfer-out students (all degree-seeking)
  survey: GR
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  variable: GRTOTLT
  filter: {GRTYPE: 4}
  subgroups: true
  unit: students
  definition: Students in the adjusted cohort known to have transferred to another institution without completing. Reported only by institutions whose mission includes preparing students to transfer.

- id: grad_rate_150
  label: Graduation rate, 150% of normal time (Student Right-to-Know)
  survey: GR
  kind: ratio
  numerator: grs_completers_150
  denominator: grs_cohort
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  unit: percent
  definition: Completers within 150% of normal time / adjusted cohort x 100. This is the rate shown in the IPEDS Data Feedback Report, figures 17 and 18.

- id: transfer_out_rate
  label: Transfer-out rate (Student Right-to-Know)
  survey: GR
  kind: ratio
  numerator: grs_transfer_out
  denominator: grs_cohort
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  unit: percent
  definition: Transfer-out students / adjusted cohort x 100. Blank for institutions that do not report transfer-outs.

- id: bach_cohort
  label: Bachelor's-seeking cohort, adjusted
  survey: GR
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  variable: GRTOTLT
  filter: {GRTYPE: 8}
  subgroups: true
  unit: students
  definition: Full-time, first-time bachelor's or equivalent degree-seeking subcohort minus allowable exclusions.

- id: bach_completers_4yr
  label: Bachelor's completers in 4 years or less
  survey: GR
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  variable: GRTOTLT
  filter: {GRTYPE: 13}
  subgroups: true
  unit: students
  definition: Bachelor's-seeking subcohort members who completed a bachelor's or equivalent degree within 4 years (100% of normal time).

- id: bach_completers_5th_yr
  label: Bachelor's completers in the 5th year
  survey: GR
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  variable: GRTOTLT
  filter: {GRTYPE: 14}
  subgroups: true
  unit: students
  definition: Completed a bachelor's or equivalent degree in the fifth year (more than 4, up to 5 years).

- id: bach_completers_6yr
  label: Bachelor's completers within 6 years
  survey: GR
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  variable: GRTOTLT
  filter: {GRTYPE: 12}
  subgroups: true
  unit: students
  definition: Bachelor's-seeking subcohort members who completed a bachelor's or equivalent degree within 150% of normal time (6 years).

- id: bach_grad_rate_4yr
  label: Bachelor's graduation rate, 4 years
  survey: GR
  kind: ratio
  numerator: bach_completers_4yr
  denominator: bach_cohort
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  unit: percent
  definition: Bachelor's completers in 4 years or less / bachelor's-seeking adjusted cohort x 100.

- id: bach_grad_rate_5yr
  label: Bachelor's graduation rate, 5 years
  survey: GR
  kind: ratio
  numerator: [bach_completers_4yr, bach_completers_5th_yr]
  denominator: bach_cohort
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  unit: percent
  definition: (Completers in 4 years or less + completers in the 5th year) / bachelor's-seeking adjusted cohort x 100.

- id: bach_grad_rate_6yr
  label: Bachelor's graduation rate, 6 years
  survey: GR
  kind: ratio
  numerator: bach_completers_6yr
  denominator: bach_cohort
  period: "Fall {cohort_6yr} cohort, status Aug 31, {year}"
  unit: percent
  definition: Bachelor's completers within 6 years / bachelor's-seeking adjusted cohort x 100.

# ---------------------------------------------------------------------------
# Fall Enrollment, part A (EF A). One row per institution per EFALEVEL; values
# by gender and race/ethnicity. Checked against the 2025 DFR, figures 3 and 4.

- id: enr_total
  label: Total fall enrollment
  survey: EFA
  period: "Fall {year}"
  variable: EFTOTLT
  filter: {EFALEVEL: 1}
  missing_row_is_zero: true
  subgroups: true
  unit: students
  definition: All students enrolled for credit in the fall, undergraduate and graduate, full- and part-time.

- id: enr_share
  label: Share of total fall enrollment
  survey: EFA
  kind: share
  of: enr_total
  period: "Fall {year}"
  unit: percent
  definition: Each gender and race/ethnicity group as a percent of total fall enrollment (DFR figure 3). Use --subgroup to pick the group.

- id: enr_undergrad
  label: Undergraduate fall enrollment
  survey: EFA
  period: "Fall {year}"
  variable: EFTOTLT
  filter: {EFALEVEL: 2}
  missing_row_is_zero: true
  subgroups: true
  unit: students
  definition: All undergraduates, full- and part-time, degree- and non-degree-seeking.

- id: enr_undergrad_share
  label: Share of undergraduate fall enrollment
  survey: EFA
  kind: share
  of: enr_undergrad
  period: "Fall {year}"
  unit: percent
  definition: Each gender and race/ethnicity group as a percent of undergraduate fall enrollment.

- id: enr_graduate
  label: Graduate fall enrollment
  survey: EFA
  period: "Fall {year}"
  variable: EFTOTLT
  filter: {EFALEVEL: 12}
  missing_row_is_zero: true
  unit: students
  definition: All graduate students, full- and part-time. Blank for institutions without graduate students.

- id: enr_fulltime
  label: Full-time fall enrollment
  survey: EFA
  period: "Fall {year}"
  variable: EFTOTLT
  filter: {EFALEVEL: 21}
  missing_row_is_zero: true
  unit: students
  definition: All full-time students, undergraduate and graduate.

- id: enr_parttime
  label: Part-time fall enrollment
  survey: EFA
  period: "Fall {year}"
  variable: EFTOTLT
  filter: {EFALEVEL: 41}
  missing_row_is_zero: true
  unit: students
  definition: All part-time students, undergraduate and graduate.

- id: enr_ft_first_time
  label: Full-time first-time degree-seeking undergraduates
  survey: EFA
  period: "Fall {year}"
  variable: EFTOTLT
  filter: {EFALEVEL: 24}
  missing_row_is_zero: true
  subgroups: true
  unit: students
  definition: The fall entering class of full-time, first-time, degree/certificate-seeking undergraduates.

- id: enr_ft_first_time_share
  label: Share of the full-time first-time class
  survey: EFA
  kind: share
  of: enr_ft_first_time
  period: "Fall {year}"
  unit: percent
  definition: Each gender and race/ethnicity group as a percent of the full-time first-time entering class.

- id: enr_ft_transfer_in
  label: Full-time transfer-in undergraduates
  survey: EFA
  period: "Fall {year}"
  variable: EFTOTLT
  filter: {EFALEVEL: 39}
  missing_row_is_zero: true
  unit: students
  definition: Full-time degree-seeking undergraduates entering for the first time as transfers.

# ---------------------------------------------------------------------------
# Human Resources, full-time instructional staff (S{year}_IS). One row per
# institution per SISCAT; values by gender and race/ethnicity. Only
# degree-granting institutions with 15+ full-time staff report this file.

- id: fac_ft_instructional
  label: Full-time instructional staff
  survey: HR
  period: "Fall {year}"
  variable: HRTOTLT
  filter: {SISCAT: 1}
  subgroups: true
  unit: staff
  definition: All full-time instructional staff, with and without faculty status.

- id: fac_ft_instructional_share
  label: Share of full-time instructional staff
  survey: HR
  kind: share
  of: fac_ft_instructional
  period: "Fall {year}"
  unit: percent
  definition: Each gender and race/ethnicity group as a percent of full-time instructional staff.

- id: fac_with_faculty_status
  label: Full-time instructional staff with faculty status
  survey: HR
  period: "Fall {year}"
  variable: HRTOTLT
  filter: {SISCAT: 100}
  unit: staff
  definition: Full-time instructional staff with faculty status (tenured, tenure-track, and non-tenure-track).

- id: fac_tenured
  label: Tenured full-time instructional faculty
  survey: HR
  period: "Fall {year}"
  variable: HRTOTLT
  filter: {SISCAT: 200}
  unit: staff
  definition: Full-time instructional staff with faculty status who are tenured.

- id: fac_tenure_track
  label: Tenure-track full-time instructional faculty
  survey: HR
  period: "Fall {year}"
  variable: HRTOTLT
  filter: {SISCAT: 300}
  unit: staff
  definition: Full-time instructional staff with faculty status on the tenure track, not yet tenured.

- id: fac_non_tenure_track
  label: Non-tenure-track full-time instructional faculty
  survey: HR
  period: "Fall {year}"
  variable: HRTOTLT
  filter: {SISCAT: 400}
  unit: staff
  definition: Full-time instructional staff with faculty status not on the tenure track, or at institutions with no tenure system.

- id: fac_pct_tenured
  label: Percent of full-time faculty who are tenured
  survey: HR
  kind: ratio
  numerator: fac_tenured
  denominator: fac_with_faculty_status
  period: "Fall {year}"
  unit: percent
  definition: Tenured / full-time instructional staff with faculty status x 100.

- id: fac_pct_tenure_line
  label: Percent of full-time faculty tenured or on tenure track
  survey: HR
  kind: ratio
  numerator: [fac_tenured, fac_tenure_track]
  denominator: fac_with_faculty_status
  period: "Fall {year}"
  unit: percent
  definition: (Tenured + tenure-track) / full-time instructional staff with faculty status x 100.

- id: fac_professors
  label: Full-time professors
  survey: HR
  period: "Fall {year}"
  variable: HRTOTLT
  filter: {SISCAT: 101}
  unit: staff
  definition: Full-time instructional staff with faculty status at the rank of professor.

- id: fac_associate_professors
  label: Full-time associate professors
  survey: HR
  period: "Fall {year}"
  variable: HRTOTLT
  filter: {SISCAT: 102}
  unit: staff
  definition: Full-time instructional staff with faculty status at the rank of associate professor.

- id: fac_assistant_professors
  label: Full-time assistant professors
  survey: HR
  period: "Fall {year}"
  variable: HRTOTLT
  filter: {SISCAT: 103}
  unit: staff
  definition: Full-time instructional staff with faculty status at the rank of assistant professor.

# ---------------------------------------------------------------------------
# Finance, private nonprofit and other FASB reporters (F{yy}{yy}_F2). One row
# per institution. Year = fiscal year end (2024 = FY July 2023 - June 2024).
# Public (GASB) institutions report a different file and are not covered yet.
# Core revenue shares checked against the 2025 DFR, figure 23.

- id: rev_tuition
  label: Tuition and fees revenue (net of discounts)
  survey: F
  period: "Fiscal year {year}"
  variable: F2D01
  flag: XF2D01
  unit: dollars
  definition: Tuition and fees, total, after institutional discounts and allowances.

- id: rev_government
  label: Government appropriations, grants, and contracts
  survey: F
  period: "Fiscal year {year}"
  variables: [F2D02, F2D03, F2D04, F2D05, F2D06, F2D07]
  unit: dollars
  definition: Federal, state, and local appropriations plus federal, state, and local grants and contracts.

- id: rev_private_gifts
  label: Private gifts, grants, and contracts
  survey: F
  period: "Fiscal year {year}"
  variables: [F2D08, F2D09]
  unit: dollars
  definition: Private gifts, grants, and contracts plus contributions from affiliated entities.

- id: rev_investment
  label: Investment return
  survey: F
  period: "Fiscal year {year}"
  variable: F2D10
  flag: XF2D10
  unit: dollars
  definition: Investment return, total (can be negative in a down market).

- id: rev_other_core
  label: Other core revenues
  survey: F
  period: "Fiscal year {year}"
  variables: [F2D11, F2D15]
  unit: dollars
  definition: Sales and services of educational activities plus other revenue.

- id: rev_core
  label: Core revenues
  survey: F
  period: "Fiscal year {year}"
  variables: [F2D01, F2D02, F2D03, F2D04, F2D05, F2D06, F2D07, F2D08, F2D09, F2D10, F2D11, F2D15]
  unit: dollars
  definition: Total revenues and investment return excluding auxiliary enterprises, hospitals, and independent operations (IPEDS core revenue definition for FASB reporters).

- id: rev_tuition_share
  label: Tuition and fees, share of core revenues
  survey: F
  kind: ratio
  numerator: rev_tuition
  denominator: rev_core
  period: "Fiscal year {year}"
  unit: percent
  definition: Tuition and fees / core revenues x 100 (DFR figure 23).

- id: rev_government_share
  label: Government revenue, share of core revenues
  survey: F
  kind: ratio
  numerator: rev_government
  denominator: rev_core
  period: "Fiscal year {year}"
  unit: percent
  definition: Government appropriations, grants, and contracts / core revenues x 100 (DFR figure 23).

- id: rev_private_gifts_share
  label: Private gifts, share of core revenues
  survey: F
  kind: ratio
  numerator: rev_private_gifts
  denominator: rev_core
  period: "Fiscal year {year}"
  unit: percent
  definition: Private gifts, grants, and contracts / core revenues x 100 (DFR figure 23).

- id: rev_investment_share
  label: Investment return, share of core revenues
  survey: F
  kind: ratio
  numerator: rev_investment
  denominator: rev_core
  period: "Fiscal year {year}"
  unit: percent
  definition: Investment return / core revenues x 100 (DFR figure 23). Negative in years with investment losses.

- id: rev_other_core_share
  label: Other core revenues, share of core revenues
  survey: F
  kind: ratio
  numerator: rev_other_core
  denominator: rev_core
  period: "Fiscal year {year}"
  unit: percent
  definition: Other core revenues / core revenues x 100 (DFR figure 23).

- id: exp_instruction
  label: Instruction expenses
  survey: F
  period: "Fiscal year {year}"
  variable: F2E011
  flag: XF2E011
  unit: dollars
  definition: Instruction, total amount (functional expense).

- id: exp_research
  label: Research expenses
  survey: F
  period: "Fiscal year {year}"
  variable: F2E021
  flag: XF2E021
  unit: dollars
  definition: Research, total amount.

- id: exp_public_service
  label: Public service expenses
  survey: F
  period: "Fiscal year {year}"
  variable: F2E031
  flag: XF2E031
  unit: dollars
  definition: Public service, total amount.

- id: exp_academic_support
  label: Academic support expenses
  survey: F
  period: "Fiscal year {year}"
  variable: F2E041
  flag: XF2E041
  unit: dollars
  definition: Academic support, total amount.

- id: exp_student_services
  label: Student services expenses
  survey: F
  period: "Fiscal year {year}"
  variable: F2E051
  flag: XF2E051
  unit: dollars
  definition: Student services, total amount.

- id: exp_institutional_support
  label: Institutional support expenses
  survey: F
  period: "Fiscal year {year}"
  variable: F2E061
  flag: XF2E061
  unit: dollars
  definition: Institutional support, total amount.

- id: exp_total
  label: Total expenses
  survey: F
  period: "Fiscal year {year}"
  variable: F2E131
  flag: XF2E131
  unit: dollars
  definition: Total expenses, all functions.

- id: exp_instruction_share
  label: Instruction, share of total expenses
  survey: F
  kind: ratio
  numerator: exp_instruction
  denominator: exp_total
  period: "Fiscal year {year}"
  unit: percent
  definition: Instruction expenses / total expenses x 100.

- id: endowment_eoy
  label: Endowment assets, end of fiscal year
  survey: F
  period: "Fiscal year {year}"
  variable: F2H02
  flag: XF2H02
  unit: dollars
  definition: Value of endowment assets at the end of the fiscal year.

- id: aid_institutional_grants
  label: Institutional grants to students
  survey: F
  period: "Fiscal year {year}"
  variables: [F2C05, F2C06]
  unit: dollars
  definition: Institutional grants, funded plus unfunded.

- id: tuition_gross
  label: Gross tuition and fees (before discounts)
  survey: F
  period: "Fiscal year {year}"
  variables: [F2D01, F2C08]
  unit: dollars
  definition: Net tuition and fees plus discounts and allowances applied to tuition and fees.

- id: discount_rate_estimate
  label: Institutional discount rate (IPEDS-based estimate)
  survey: F
  kind: ratio
  numerator: aid_institutional_grants
  denominator: tuition_gross
  period: "Fiscal year {year}"
  unit: percent
  definition: Institutional grants / gross tuition and fees x 100. An approximation of the NACUBO discount rate from IPEDS finance data; institutional grants applied to room and board are included.

# ---------------------------------------------------------------------------
# 12-month enrollment and instructional activity (EFIA). One row per
# institution. EFIA{year} covers the academic year ending in {year}, which
# lines up with finance fiscal year {year}. Checked against DFR figure 4.

- id: fte_12month
  label: 12-month FTE enrollment (reported)
  survey: EFIA
  period: "Academic year {prior_year}-{year}"
  variables: [FTEUG, FTEGD, FTEDPP]
  unit: students (FTE)
  definition: Reported full-time equivalent enrollment for the 12-month year, undergraduate + graduate + doctor's professional practice. The FTE IPEDS uses for per-student finance figures.

# ---------------------------------------------------------------------------
# Derived metrics: ratios across files for the same institution and year.
# Per-FTE figures checked against DFR figure 24 (fiscal year 2024).

- id: exp_instruction_per_fte
  label: Instruction expenses per FTE student
  survey: derived
  kind: ratio
  numerator: exp_instruction
  denominator: fte_12month
  scale: 1
  digits: 0
  period: "Fiscal year {year}"
  unit: dollars per FTE
  definition: Instruction expenses / 12-month FTE enrollment (DFR figure 24).

- id: exp_research_per_fte
  label: Research expenses per FTE student
  survey: derived
  kind: ratio
  numerator: exp_research
  denominator: fte_12month
  scale: 1
  digits: 0
  period: "Fiscal year {year}"
  unit: dollars per FTE
  definition: Research expenses / 12-month FTE enrollment (DFR figure 24).

- id: exp_public_service_per_fte
  label: Public service expenses per FTE student
  survey: derived
  kind: ratio
  numerator: exp_public_service
  denominator: fte_12month
  scale: 1
  digits: 0
  period: "Fiscal year {year}"
  unit: dollars per FTE
  definition: Public service expenses / 12-month FTE enrollment (DFR figure 24).

- id: exp_academic_support_per_fte
  label: Academic support expenses per FTE student
  survey: derived
  kind: ratio
  numerator: exp_academic_support
  denominator: fte_12month
  scale: 1
  digits: 0
  period: "Fiscal year {year}"
  unit: dollars per FTE
  definition: Academic support expenses / 12-month FTE enrollment (DFR figure 24).

- id: exp_student_services_per_fte
  label: Student services expenses per FTE student
  survey: derived
  kind: ratio
  numerator: exp_student_services
  denominator: fte_12month
  scale: 1
  digits: 0
  period: "Fiscal year {year}"
  unit: dollars per FTE
  definition: Student services expenses / 12-month FTE enrollment (DFR figure 24).

- id: exp_institutional_support_per_fte
  label: Institutional support expenses per FTE student
  survey: derived
  kind: ratio
  numerator: exp_institutional_support
  denominator: fte_12month
  scale: 1
  digits: 0
  period: "Fiscal year {year}"
  unit: dollars per FTE
  definition: Institutional support expenses / 12-month FTE enrollment (DFR figure 24).

- id: exp_total_per_fte
  label: Total expenses per FTE student
  survey: derived
  kind: ratio
  numerator: exp_total
  denominator: fte_12month
  scale: 1
  digits: 0
  period: "Fiscal year {year}"
  unit: dollars per FTE
  definition: Total expenses (all functions, including auxiliary enterprises) / 12-month FTE enrollment.

- id: rev_tuition_per_fte
  label: Net tuition and fees revenue per FTE student
  survey: derived
  kind: ratio
  numerator: rev_tuition
  denominator: fte_12month
  scale: 1
  digits: 0
  period: "Fiscal year {year}"
  unit: dollars per FTE
  definition: Tuition and fees revenue (net of discounts) / 12-month FTE enrollment.

